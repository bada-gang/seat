<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자리 바꾸기</title>
<style>
  :root {
    --board: #2f5d50;
    --board-deep: #24483e;
    --paper: #f2f4f1;
    --desk: #ffffff;
    --desk-edge: #cfd6cf;
    --ink: #22302b;
    --chalk: #fdf6d8;
    --accent: #e8b93a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  header {
    width: 100%;
    max-width: 860px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; margin-right: auto; }
  #editLayout {
    border: 1.5px solid var(--desk-edge);
    background: #fff;
    color: var(--ink);
    font-size: 0.95rem;
    font-weight: 700;
    padding: 11px 18px;
    border-radius: 12px;
    cursor: pointer;
  }
  #editLayout.on {
    background: var(--accent);
    border-color: var(--accent);
    color: #4a3a08;
  }
  #shuffle {
    border: none;
    background: var(--board);
    color: var(--chalk);
    font-size: 1rem;
    font-weight: 800;
    padding: 12px 22px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 3px 0 var(--board-deep);
    transition: transform 0.08s ease;
  }
  #shuffle:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--board-deep); }
  #shuffle:disabled { opacity: 0.6; cursor: wait; }
  .blackboard {
    width: 100%;
    max-width: 860px;
    background: linear-gradient(var(--board), var(--board-deep));
    color: var(--chalk);
    text-align: center;
    font-weight: 700;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    padding: 10px 0;
    border-radius: 10px;
    border: 4px solid #8a6b45;
    margin-bottom: 22px;
    font-size: 0.9rem;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 860px;
  }
  .desk {
    position: relative;
    background: var(--desk);
    border: 1.5px solid var(--desk-edge);
    border-bottom-width: 4px;
    border-radius: 10px;
    min-height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 6px;
    cursor: text;
    transition: transform 0.35s cubic-bezier(0.34, 1.3, 0.5, 1), border-color 0.15s, background 0.15s, opacity 0.15s;
  }
  .desk:focus-within { border-color: var(--accent); }
  .desk input {
    width: 100%;
    border: none;
    background: transparent;
    text-align: center;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    color: var(--ink);
    outline: none;
  }
  .desk input::placeholder { color: #b9c2bb; font-weight: 500; }
  /* 비활성 책상: 자리 없음 */
  .desk.off {
    background: transparent;
    border: 2px dashed #c3cdc5;
    border-bottom-width: 2px;
    cursor: default;
  }
  .desk.off input { display: none; }
  /* 배치 편집 모드 */
  body.editing .desk { cursor: pointer; }
  body.editing .desk input { pointer-events: none; }
  body.editing .desk:not(.off):hover { border-color: var(--accent); }
  body.editing .desk.off:hover { border-color: var(--accent); border-style: dashed; }
  body.editing .desk::after {
    content: '';
    position: absolute;
    inset: 0;
  }
  footer {
    margin-top: 18px;
    font-size: 0.8rem;
    color: #7d8b84;
    text-align: center;
    line-height: 1.6;
  }
  @media (max-width: 560px) {
    .desk { min-height: 52px; }
    .desk input { font-size: 0.85rem; }
    h1 { width: 100%; }
  }
</style>
</head>
<body>
  <header>
    <h1>자리 바꾸기</h1>
    <button id="editLayout">배치 편집</button>
    <button id="shuffle">자리 섞기</button>
  </header>

  <div class="blackboard">칠판</div>
  <div id="grid"></div>
  <footer id="hint">책상을 눌러 이름을 입력하세요. 빈 책상은 섞을 때 제외됩니다.</footer>

<script>
(function () {
  var SIZE = 25; // 5x5 고정 틀
  var names = [];
  var active = [];
  for (var i = 0; i < SIZE; i++) { names.push(''); active.push(true); }

  var editing = false;

  var grid = document.getElementById('grid');
  var shuffleBtn = document.getElementById('shuffle');
  var editBtn = document.getElementById('editLayout');
  var hint = document.getElementById('hint');

  function render() {
    grid.innerHTML = '';
    names.forEach(function (name, i) {
      var desk = document.createElement('div');
      desk.className = 'desk' + (active[i] ? '' : ' off');
      var input = document.createElement('input');
      input.type = 'text';
      input.placeholder = '이름';
      input.value = name;
      input.maxLength = 12;
      input.addEventListener('input', function () { names[i] = input.value; });
      desk.addEventListener('click', function () {
        if (editing) {
          active[i] = !active[i];
          desk.classList.toggle('off', !active[i]);
        } else if (active[i]) {
          input.focus();
        }
      });
      desk.appendChild(input);
      grid.appendChild(desk);
    });
  }

  function setEditing(on) {
    editing = on;
    document.body.classList.toggle('editing', on);
    editBtn.classList.toggle('on', on);
    editBtn.textContent = on ? '편집 완료' : '배치 편집';
    shuffleBtn.disabled = on;
    hint.textContent = on
      ? '책상을 눌러 자리를 켜거나 끄세요. 끈 자리의 이름은 지워지지 않고 보관됩니다.'
      : '책상을 눌러 이름을 입력하세요. 빈 책상은 섞을 때 제외됩니다.';
  }

  function shuffle() {
    // 활성 책상 중 이름이 있는 자리끼리만 무작위 재배치 (Fisher–Yates)
    var idx = [];
    names.forEach(function (n, i) {
      if (active[i] && n.trim() !== '') idx.push(i);
    });
    if (idx.length < 2) return;

    var pool = idx.map(function (i) { return names[i]; });
    for (var i = pool.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
    }

    // FLIP 애니메이션
    var desks = grid.children;
    var firstRects = idx.map(function (i) { return desks[i].getBoundingClientRect(); });

    shuffleBtn.disabled = true;
    idx.forEach(function (targetIdx, k) {
      var fromK = idx.findIndex(function (srcIdx) { return names[srcIdx] === pool[k]; });
      var fromRect = firstRects[fromK !== -1 ? fromK : k];
      var toRect = desks[targetIdx].getBoundingClientRect();
      var desk = desks[targetIdx];
      desk.style.transition = 'none';
      desk.style.transform = 'translate(' + (fromRect.left - toRect.left) + 'px,' + (fromRect.top - toRect.top) + 'px)';
    });

    idx.forEach(function (targetIdx, k) {
      names[targetIdx] = pool[k];
      desks[targetIdx].querySelector('input').value = pool[k];
    });

    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        idx.forEach(function (targetIdx) {
          var desk = desks[targetIdx];
          desk.style.transition = '';
          desk.style.transform = '';
        });
        setTimeout(function () { shuffleBtn.disabled = false; }, 400);
      });
    });
  }

  editBtn.addEventListener('click', function () { setEditing(!editing); });
  shuffleBtn.addEventListener('click', shuffle);

  render();
})();
</script>
</body>
</html>
